<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiet HUD</title>
<link rel="stylesheet" href="quiet.css">
<style>
  .screen { background-image: url('img/bg_hud.jpg'); }

  /* compass */
  .compass { left: 680px; top: 38px; width: 560px; height: 90px; }
  .compass .card { position: absolute; top: 0; width: 60px; margin-left: -30px; text-align: center; font-size: 15px; font-weight: 500; }
  .compass svg.strip { position: absolute; left: 0; top: 22px; }
  .mark { position: absolute; top: 42px; width: 80px; margin-left: -40px; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; font-weight: 500; }
  .mark .num { font-size: 15px; }

  /* round facts, top right */
  .facts { right: 44px; top: 30px; text-align: right; }
  .facts .left { display: flex; justify-content: flex-end; align-items: baseline; gap: 10px; }
  .facts .left b { font-weight: 300; font-size: 46px; line-height: 50px; }
  .facts .left span { font-size: 17px; font-weight: 500; }
  .facts .day { font-size: 16px; margin-top: 2px; }
  .feed { right: 44px; top: 138px; text-align: right; font-size: 16px; font-weight: 500; }
  .feed div { display: flex; justify-content: flex-end; align-items: center; gap: 9px; height: 28px; }

  /* vitals, bottom left */
  .vitals { left: 44px; bottom: 44px; display: flex; flex-direction: column; gap: 15px; }
  .vital { display: flex; align-items: center; gap: 11px; height: 18px; }
  .vital .line { width: 220px; }
  .vital .tick { position: absolute; left: 50%; top: -3px; width: 1px; height: 9px; background: rgba(244,241,234,.75); }
  .vital .num { width: 28px; font-size: 15px; text-align: right; text-shadow: var(--t); }
  .vital.low .line > i { background: var(--sun); }
  .vital.low .num { color: var(--sun); }
  .vital.low .ic-ink { fill: var(--sun); }

  /* hotbar */
  .hotbar { left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; align-items: flex-end; }
  .slot { position: relative; width: 96px; display: flex; flex-direction: column; align-items: center; }
  .slot .pic { height: 70px; display: flex; align-items: flex-end; justify-content: center; position: relative; }
  .slot .n { margin-top: 8px; font-size: 15px; opacity: .78; text-shadow: var(--t); }
  .slot .count { position: absolute; left: 100%; margin-left: -4px; bottom: -4px; font-size: 15px; text-shadow: var(--t); }
  .slot:not(.on) svg.ic { opacity: .9; }
  .slot .under { width: 26px; height: 2px; margin-top: 5px; background: transparent; }
  .slot.on { opacity: 1; }
  .slot.on .n { opacity: 1; }
  .slot.on .under { background: var(--ink); box-shadow: 0 1px 0 rgba(13,16,18,.45); }
  .slot .name { position: absolute; bottom: 120px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 16px; font-weight: 500; }
  .slot.empty .pic i { width: 10px; height: 10px; margin-bottom: 22px; border: 1.5px solid rgba(244,241,234,.75); border-radius: 50%; box-shadow: 0 1px 1px rgba(13,16,18,.4); }

  /* centre */
  .cross { left: 940px; top: 520px; }
  .prompt { left: 0; right: 0; top: 592px; display: flex; justify-content: center; align-items: center; gap: 13px; font-size: 20px; }

  /* the small "outside the border" picture */
  .inset-cap { right: 44px; bottom: 322px; width: 464px; font-size: 15px; font-weight: 500; }
  .inset { right: 44px; bottom: 44px; width: 464px; height: 261px; background: url('img/bg_border.jpg') center/cover; outline: 1px solid rgba(244,241,234,.75); box-shadow: 0 2px 6px rgba(13,16,18,.45); }
  .inset .edge { position: absolute; inset: 8px; border: 2px solid var(--red); box-shadow: 0 0 0 1px rgba(13,16,18,.35), inset 0 0 0 1px rgba(13,16,18,.35); }
  .inset .strip { position: absolute; left: 92px; top: 34px; width: 280px; height: 1px; background: var(--red); box-shadow: 0 1px 0 rgba(13,16,18,.4); }
  .inset .arrow { position: absolute; left: 72px; top: 27px; }
  .inset .msg { position: absolute; left: 0; right: 0; top: 50px; text-align: center; }
  .inset .msg b { display: block; font-size: 20px; font-weight: 500; }
  .inset .msg span { display: block; margin-top: 4px; font-size: 15px; }
  .inset .msg em { font-style: normal; color: var(--red); }
  .inset .hp { position: absolute; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 9px; }
  .inset .hp .line { width: 150px; }
  .inset .hp .line > i { background: var(--red); }
  .inset .hp .ic-ink { fill: var(--red); }
  .inset .hp .num { font-size: 15px; text-shadow: var(--t); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="heart" viewBox="0 0 24 24"><polygon points="12,21 3,12 3,7 6,4 9,4 12,7 15,4 18,4 21,7 21,12"/></symbol>
    <symbol id="food" viewBox="0 0 24 24"><rect x="3.5" y="2" width="1.9" height="7"/><rect x="6.55" y="2" width="1.9" height="7"/><rect x="9.6" y="2" width="1.9" height="7"/><rect x="3.5" y="8" width="8" height="3"/><rect x="6.2" y="10" width="2.6" height="12"/><polygon points="15,2 20,7 20,13.5 17.6,13.5 17.6,22 15,22"/></symbol>
    <symbol id="drop" viewBox="0 0 24 24"><polygon points="12,2 19,13 19,17 15,21 9,21 5,17 5,13"/></symbol>
    <symbol id="spire" viewBox="0 0 24 24"><polygon points="12,2 16,21 8,21"/><polygon points="6,11 9,21 3,21"/><polygon points="18,11 21,21 15,21"/></symbol>
    <symbol id="person" viewBox="0 0 24 24"><rect x="8.5" y="2" width="7" height="6.5"/><rect x="6" y="9.5" width="12" height="7.5"/><rect x="7.5" y="18" width="4" height="4.5"/><rect x="12.5" y="18" width="4" height="4.5"/></symbol>
    <symbol id="blade" viewBox="0 0 24 24"><g transform="rotate(45 12 12)"><polygon points="12,0 14,3 14,15 10,15 10,3"/><rect x="6.5" y="15" width="11" height="2.4"/><rect x="10.8" y="17.4" width="2.4" height="5"/></g></symbol>

    <symbol id="i-sword" viewBox="0 0 48 48"><g transform="rotate(45 24 24)">
      <polygon class="ic-ink" points="24,-3 28,3 28,31 20,31 20,3"/><polygon class="ic-2" points="24,-3 28,3 28,31 24,31"/>
      <rect class="ic-ink" x="13" y="31" width="22" height="4.5"/><rect class="ic-2" x="21.5" y="35.5" width="5" height="9"/><rect class="ic-ink" x="20.5" y="44.5" width="7" height="4.5"/></g></symbol>
    <symbol id="i-bow" viewBox="0 0 48 48"><g transform="rotate(-45 24 24)">
      <line x1="20" y1="2" x2="20" y2="46" stroke="#BDB8AC" stroke-width="1.6"/>
      <polyline points="20,2 29,11 33,24 29,37 20,46" fill="none" stroke="#F4F1EA" stroke-width="4.6" stroke-linejoin="miter"/>
      <rect class="ic-2" x="8" y="22.8" width="34" height="2.4"/><polygon class="ic-ink" points="40,19 48,24 40,29"/>
      <polygon class="ic-ink" points="5,20 9,20 12,24 9,28 5,28 8,24"/></g></symbol>
    <symbol id="i-apple" viewBox="0 0 48 48">
      <polygon class="ic-ink" points="24,15 30,12 37,15 41,23 39,33 33,42 24,40 15,42 9,33 7,23 11,15 18,12"/>
      <polygon class="ic-2" points="24,15 30,12 37,15 41,23 39,33 33,42 24,40"/>
      <rect class="ic-2" x="22.8" y="5" width="2.6" height="9"/><polygon class="ic-ink" points="26,10 35,4 33,11"/></symbol>
    <symbol id="i-bottle" viewBox="0 0 48 48">
      <rect class="ic-2" x="19" y="2" width="10" height="5"/><rect class="ic-ink" x="20.5" y="7" width="7" height="7"/>
      <polygon class="ic-ink" points="20.5,14 27.5,14 35,21 35,43 32,46 16,46 13,43 13,21"/>
      <rect class="ic-2" x="13" y="27" width="22" height="10"/></symbol>
    <symbol id="i-bandage" viewBox="0 0 48 48"><g transform="rotate(-45 24 24)">
      <rect class="ic-ink" x="3" y="16" width="42" height="16" rx="5"/><rect class="ic-2" x="17" y="16" width="14" height="16"/>
      <rect class="ic-ink" x="20" y="20" width="2.4" height="2.4"/><rect class="ic-ink" x="25.6" y="20" width="2.4" height="2.4"/><rect class="ic-ink" x="20" y="25.6" width="2.4" height="2.4"/><rect class="ic-ink" x="25.6" y="25.6" width="2.4" height="2.4"/></g></symbol>
  </defs>
</svg>

<div class="screen">

  <!-- compass: one hairline, three letters, markers hang under it -->
  <div class="abs compass">
    <div class="card txt dim" style="left:14px">NW</div>
    <div class="card txt" style="left:224px">N</div>
    <div class="card txt dim" style="left:434px">NE</div>
    <svg class="strip ic" width="560" height="18" viewBox="0 0 560 18">
      <g stroke="#F4F1EA" stroke-width="1" opacity=".6">
        <line x1="0" y1="12.5" x2="560" y2="12.5"/>
        <line x1="84.5" y1="7" x2="84.5" y2="12"/><line x1="154.5" y1="7" x2="154.5" y2="12"/><line x1="294.5" y1="7" x2="294.5" y2="12"/><line x1="364.5" y1="7" x2="364.5" y2="12"/><line x1="504.5" y1="7" x2="504.5" y2="12"/>
      </g>
      <g stroke="#F4F1EA" stroke-width="1"><line x1="14.5" y1="3" x2="14.5" y2="12"/><line x1="224.5" y1="3" x2="224.5" y2="12"/><line x1="434.5" y1="3" x2="434.5" y2="12"/></g>
      <rect x="279" y="0" width="2" height="18" fill="#F4F1EA"/>
    </svg>
    <div class="mark" style="left:131px">
      <svg class="ic" width="17" height="17" style="fill:var(--sun)"><use href="#drop"/></svg>
      <span class="txt" style="color:var(--sun)"><span class="num">64</span> m</span>
    </div>
    <div class="mark" style="left:401px">
      <svg class="ic ic-ink" width="17" height="17"><use href="#spire"/></svg>
      <span class="txt"><span class="num">210</span> m</span>
    </div>
  </div>

  <!-- contenders left, day and time -->
  <div class="abs facts txt">
    <div class="left"><b>17</b><span>left</span></div>
    <div class="day">Day 2 <span class="dim">&nbsp;·&nbsp;</span> <span class="num">14:32</span></div>
  </div>
  <div class="abs feed txt">
    <div>Kestrel <svg class="ic ic-ink" width="15" height="15"><use href="#blade"/></svg> Rowan</div>
    <div style="opacity:.5">Orla <span style="font-weight:400">was caught by the border</span></div>
  </div>

  <!-- crosshair and prompt -->
  <svg class="abs cross" width="40" height="40" viewBox="0 0 40 40">
    <circle cx="20" cy="20" r="12" fill="none" stroke="#0D1012" stroke-opacity=".28" stroke-width="2.4"/>
    <circle cx="20" cy="20" r="12" fill="none" stroke="#F4F1EA" stroke-opacity=".55" stroke-width="1"/>
    <circle cx="20" cy="20" r="3.2" fill="#0D1012" fill-opacity=".45"/><circle cx="20" cy="20" r="2" fill="#F4F1EA"/>
  </svg>
  <div class="abs prompt txt"><span class="key">E</span><span>Open crate</span></div>

  <!-- health, hunger, thirst -->
  <div class="abs vitals">
    <div class="vital">
      <svg class="ic ic-ink" width="18" height="18"><use href="#heart"/></svg>
      <div class="line" style="height:4px"><i style="width:72%"></i></div><span class="num">72</span>
    </div>
    <div class="vital rest">
      <svg class="ic ic-ink" width="18" height="18"><use href="#food"/></svg>
      <div class="line"><i style="width:81%"></i><span class="tick"></span></div><span class="num">81</span>
    </div>
    <div class="vital low">
      <svg class="ic ic-ink" width="18" height="18"><use href="#drop"/></svg>
      <div class="line"><i style="width:34%"></i><span class="tick"></span></div><span class="num">34</span>
    </div>
  </div>

  <!-- hotbar: no boxes, the picture shows through -->
  <div class="abs hotbar">
    <div class="slot on"><span class="name txt">Iron sword</span><div class="pic"><svg class="ic" width="70" height="70"><use href="#i-sword"/></svg></div><span class="n num">1</span><span class="under"></span></div>
    <div class="slot"><div class="pic"><svg class="ic" width="56" height="56"><use href="#i-bow"/></svg><span class="count num">12</span></div><span class="n num">2</span><span class="under"></span></div>
    <div class="slot"><div class="pic"><svg class="ic" width="56" height="56"><use href="#i-apple"/></svg><span class="count num">2</span></div><span class="n num">3</span><span class="under"></span></div>
    <div class="slot"><div class="pic"><svg class="ic" width="56" height="56"><use href="#i-bottle"/></svg></div><span class="n num">4</span><span class="under"></span></div>
    <div class="slot"><div class="pic"><svg class="ic" width="56" height="56"><use href="#i-bandage"/></svg><span class="count num">3</span></div><span class="n num">5</span><span class="under"></span></div>
    <div class="slot empty"><div class="pic"><i></i></div><span class="n num">6</span><span class="under"></span></div>
  </div>

  <!-- border warning, shown small -->
  <div class="abs inset-cap txt">Outside the border (shown small)</div>
  <div class="abs inset">
    <div class="edge"></div>
    <div class="strip"></div>
    <svg class="arrow ic" width="14" height="14" viewBox="0 0 14 14"><polygon points="1,7 10,1 10,13" fill="#DE5B4B"/></svg>
    <div class="msg txt"><b>Outside the border</b><span>Turn back <span class="dim" style="display:inline">·</span> <span class="num" style="display:inline">28</span> m</span></div>
    <div class="hp"><svg class="ic ic-ink" width="16" height="16"><use href="#heart"/></svg><div class="line"><i style="width:58%"></i></div><span class="num">58</span></div>
  </div>
</div>
</body>
</html>
